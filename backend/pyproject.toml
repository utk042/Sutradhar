[project]
name = "sutradhar-backend"
version = "0.1.0"
description = "Sutradhar — document verification desk. Multi-agent orchestration with a human review gate."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

# Explicit, because the project root also holds scripts/, tests/ and alembic/,
# which setuptools' auto-discovery refuses to disambiguate.
[tool.setuptools.packages.find]
include = ["app*"]
